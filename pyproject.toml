[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-immunity"
version = "0.3.0a1"
description = "Experimental explicit-policy checker and MCP stdio tool proxy"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "inco308" }]
keywords = ["ai-agent", "mcp", "tool-policy", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-immunity = "agent_immunity.mcp_stdio:main"
agent-immunity-check = "agent_immunity.doctor:main"
agent-immunity-capture = "agent_immunity.capture:main"
agent-immunity-probe = "agent_immunity.probe:main"
agent-immunity-drill = "agent_immunity.drill:main"

[project.optional-dependencies]
# 采集上游 tools/list 快照需要官方 MCP SDK；核心运行时仍不依赖它。
interop = ["mcp==1.30.0"]

[project.urls]
Homepage = "https://github.com/inco308/agent-immunity"
Repository = "https://github.com/inco308/agent-immunity"
Documentation = "https://github.com/inco308/agent-immunity/tree/main/docs"
Issues = "https://github.com/inco308/agent-immunity/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_immunity*"]

[tool.setuptools.package-data]
"agent_immunity.dataset" = ["*.json"]
