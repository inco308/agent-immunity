[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-immunity"
version = "0.2.0"
description = "Experimental explicit-policy checker and MCP stdio tool proxy"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "inco308" }]
keywords = ["ai-agent", "mcp", "tool-policy", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-immunity = "agent_immunity.mcp_stdio:main"

[project.urls]
Homepage = "https://github.com/inco308/agent-immunity"
Repository = "https://github.com/inco308/agent-immunity"
Documentation = "https://github.com/inco308/agent-immunity/tree/main/docs"
Issues = "https://github.com/inco308/agent-immunity/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_immunity*"]

[tool.setuptools.package-data]
"agent_immunity.dataset" = ["*.json"]
