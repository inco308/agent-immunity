name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: 测试与模拟规则基准
        shell: pwsh
        run: ./verify.ps1
      - name: 安装构建前端
        run: python -m pip install build==1.6.1
      - name: 构建源码分发包及其 wheel
        run: python -m build --outdir dist
      - name: 检查归档内容、独立安装和 SHA-256
        run: python -X utf8 scripts/check_dist.py dist --report artifacts/package-install.json
      - name: 核对两个安装环境的 macOS、架构和 Python 系列
        if: matrix.os == 'macos-15'
        shell: pwsh
        env:
          EXPECTED_PYTHON_SERIES: ${{ matrix.python }}
        run: |
          $report = Get-Content -Raw artifacts/package-install.json | ConvertFrom-Json
          if ($report.status -cne 'passed' -or ($report.packages.kind -join ',') -cne 'wheel,sdist') {
            throw '需要两份发行文件均完成安装验收'
          }
          foreach ($package in $report.packages) {
            if ($package.system -cne 'Darwin' -or $package.os_version -notlike '15.*' -or
                $package.machine -cne 'arm64' -or $package.implementation -cne 'CPython' -or
                !$package.python.StartsWith("$env:EXPECTED_PYTHON_SERIES.")) {
              throw "安装环境与 macOS 15 arm64 / CPython $env:EXPECTED_PYTHON_SERIES 不符"
            }
            Write-Output "$($package.kind): macOS $($package.os_version) $($package.machine), CPython $($package.python)"
          }
      - name: 保存 macOS 安装验收报告
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package-install-macos-15-py${{ matrix.python }}
          path: artifacts/package-install.json
          if-no-files-found: error
      - name: 核对两个安装环境的 x64 系统、架构和 Python 系列
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        run: >-
          python -X utf8 -m scripts.check_x64_install_report artifacts/package-install.json
          --runner ${{ matrix.os }} --python-series ${{ matrix.python }}
      - name: 保存 x64 安装验收报告
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package-install-${{ matrix.os }}-py${{ matrix.python }}
          path: artifacts/package-install.json
          if-no-files-found: error
      - name: 保存可下载的发行文件
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: agent-immunity-dist
          path: |
            dist/agent_immunity-*.whl
            dist/agent_immunity-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
  interop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.1"
      - name: 安装锁定的独立客户端及 SDK
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r interop/requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix interop --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 真实客户端与 SDK 上游端到端验证
        run: python -X utf8 interop/run_e2e.py
      - name: 上游目录采集与预部署检查
        shell: pwsh
        run: |
          python -X utf8 -m unittest interop.test_capture_catalog -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -m interop.capture_catalog --output artifacts/example-tools.json -- python examples/local_tools.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -m agent_immunity.doctor --policy examples/policy.json --catalog artifacts/example-tools.json --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: LLM 评测器隔离与验收回归（测试替身，非模型成绩）
        run: python -X utf8 -m unittest interop.test_llm_harness interop.test_ollama_recovery -v
      - name: 保存公开验证结果
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: interop-${{ matrix.os }}
          path: |
            artifacts/interop/report.json
            artifacts/interop/status-report.md
          if-no-files-found: warn
