name: live-llm-eval

# 单独手动启动；普通 push/PR 的六组验证保持不变。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-llm-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ollama-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OLLAMA_VERSION: "0.40.15"
      # 来自官方 v0.40.15 release 资产的 SHA256（2026-11-11 核验）。
      OLLAMA_ARCHIVE_SHA256: "628c018404a4206493efd38e46251c154ede5141b8b8dc85c659b3b027c47379"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装锁定的官方 MCP Python SDK
        timeout-minutes: 3
        run: python -m pip install --require-hashes -r interop/requirements.lock
      - name: 下载并校验固定版本的 Ollama
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          runtime="$RUNNER_TEMP/ollama"
          mkdir -p "$runtime"
          curl --fail --location --silent --show-error --retry 2 --retry-max-time 360 \
            --connect-timeout 20 --max-time 360 \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst" \
            --output "$archive"
          printf '%s  %s\n' "$OLLAMA_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          tar --zstd --extract --file="$archive" --directory="$runtime"
          test -x "$runtime/bin/ollama"
          rm -- "$archive"
      - name: 运行真实 4B 模型的三场景对照评测
        timeout-minutes: 24
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 -m evals.ci_ollama \
            --ollama-bin "$RUNNER_TEMP/ollama/bin/ollama" \
            --runtime-root "$RUNNER_TEMP" \
            --output artifacts/llm-eval/ci.json
      - name: 保存评测报告与虚构数据轨迹
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: llm-eval-ollama-qwen3.5-4b
          # 只上传指定报告和轨迹；不上传模型缓存、服务日志、登录信息或进程环境。
          path: |
            artifacts/llm-eval/ci.json
            artifacts/llm-eval/ci.md
            artifacts/llm-eval/run-*/**/trajectory.json
          if-no-files-found: warn
          retention-days: 14
